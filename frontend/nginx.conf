server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API and live run streams go to the backend container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # Server-sent events: never buffer, and let an agent run stay open
        # far longer than nginx's 60-second default.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
